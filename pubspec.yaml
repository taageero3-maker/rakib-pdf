
name: rakib_pdf
description: All-in-One PDF Scanner and Editor.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  pdf: ^3.11.3
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  document_scan: ^0.5.0
  flutter_pdfview: ^1.4.5
  share_plus: ^12.0.1
  file_picker: ^10.3.7
  pdf_document: ^15.0.0
  file_compression_plus: ^1.0.0
  ares_defence_labs_lock_smith_pdf: ^0.0.8
  pdf_manipulator: ^6.0.0
  pdfx: ^2.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

hooks:
  user_defines:
    pdf_manipulator:
      ^6.0.0
      keep: [office]
