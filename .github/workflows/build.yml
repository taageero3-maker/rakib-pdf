
name: Build RAKIB PDF APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android --org com.rakib .

      - name: Show Android Gradle Config
        run: |
          echo "===== build.gradle.kts ====="
          cat android/app/build.gradle.kts || true
          echo "===== build.gradle ====="
          cat android/app/build.gradle || true

      
      - name: Fix Android R8 Build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              gradle = Path("android/app/build.gradle")

          if not gradle.exists():
              raise SystemExit("ERROR: Android Gradle file not found")

          text = gradle.read_text(encoding="utf-8")

          patterns = [
              (r"isMinifyEnabled\s*=\s*true", "isMinifyEnabled = false"),
              (r"isShrinkResources\s*=\s*true", "isShrinkResources = false"),
              (r"minifyEnabled\s+true", "minifyEnabled false"),
              (r"shrinkResources\s+true", "shrinkResources false"),
          ]

          for pattern, replacement in patterns:
              text = re.sub(pattern, replacement, text)

          gradle.write_text(text, encoding="utf-8")

          print("----- Android release configuration -----")
          for number, line in enumerate(text.splitlines(), 1):
              if "buildTypes" in line or "release" in line or "Minify" in line or "minify" in line or "shrinkResources" in line:
                  print(f"{number}: {line}")

          if re.search(r"(?:isMinifyEnabled\s*=\s*true|minifyEnabled\s+true)", text):
              raise SystemExit("ERROR: Minification is STILL enabled")

          print("Gradle file checked. No explicit minify=true setting remains.")
          PY


      - name: Set App Display Name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          text = re.sub(
              r'android:label="[^"]*"',
              'android:label="olof-pdf"',
              text,
              count=1
          )

          manifest.write_text(text, encoding="utf-8")
          print("App name changed successfully")
          PY
          
      - name: Configure JP2 dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("android")
          root_gradle = next((p for p in [root / "build.gradle", root / "build.gradle.kts"] if p.exists()), None)
          app_gradle = next((p for p in [root / "app/build.gradle", root / "app/build.gradle.kts"] if p.exists()), None)

          if not root_gradle or not app_gradle:
              raise Exception("Gradle files lama helin")

          root_text = root_gradle.read_text()
          app_text = app_gradle.read_text()

          if "jitpack.io" not in root_text:
              pattern = r"(allprojects\s*\{\s*repositories\s*\{)"
              match = re.search(pattern, root_text)
              if not match:
                  raise Exception("allprojects repositories lama helin")
              root_text = root_text[:match.end()] + '\n        maven { url "https://jitpack.io" }\n' + root_text[match.end():]
              if root_gradle.name.endswith(".kts"):
                  root_text = root_text.replace('maven { url "https://jitpack.io" }', 'maven(url = "https://jitpack.io")')
              root_gradle.write_text(root_text)

          if "JP2ForAndroid" not in app_text:
              if app_gradle.name.endswith(".kts"):
                  app_text += '\n\ndependencies {\n    runtimeOnly("com.github.Tgo1014:JP2ForAndroid:1.0.4")\n}\n'
              else:
                  app_text += '\n\ndependencies {\n    runtimeOnly "com.github.Tgo1014:JP2ForAndroid:1.0.4"\n}\n'
              app_gradle.write_text(app_text)

          print("JP2 dependency configured successfully")
          PY


      
      - name: Install dependencies
        run: flutter pub get
        
      - name: Generate App Icon
        run: dart run flutter_launcher_icons
        
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease -x lintVitalAnalyzeRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAKIB-PDF-APK
          path: build/app/outputs/flutter-apk/app-release.apk
