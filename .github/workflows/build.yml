
name: Build RAKIB PDF APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android --org com.rakib .

      - name: Show Android Gradle Config
        run: |
          echo "===== build.gradle.kts ====="
          cat android/app/build.gradle.kts || true
          echo "===== build.gradle ====="
          cat android/app/build.gradle || true

      
      
      - name: Fix Android R8 Build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("android/app")
          gradle = root / "build.gradle.kts"

          if not gradle.exists():
              gradle = root / "build.gradle"

          if not gradle.exists():
              raise SystemExit("Android Gradle file not found")

          text = gradle.read_text(encoding="utf-8")

          rules = root / "proguard-rules.pro"
          rules.write_text("""
          # Keep ML Kit classes used through reflection
          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.internal.mlkit_vision_text.** { *; }
          -keep class com.google.android.gms.internal.mlkit_vision_common.** { *; }
          -keep class com.google.android.gms.internal.mlkit_common.** { *; }

          # Keep Firebase component constructors
          -keep class * implements com.google.firebase.components.ComponentRegistrar { void <init>(); }

          # Optional OCR language modules
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          """.strip() + "\n", encoding="utf-8")


          if "proguard-rules.pro" not in text:
              match = re.search(r'buildTypes\s*\{', text)
              if not match:
                  raise SystemExit("buildTypes block not found")

              release = re.search(r'release\s*\{', text[match.end():])
              if not release:
                  raise SystemExit("release block not found")

              insert_at = match.end() + release.end()

              if gradle.name.endswith(".kts"):
                  config = """
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  """
              else:
                  config = """
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  """

              text = text[:insert_at] + "\n" + config + text[insert_at:]

          gradle.write_text(text, encoding="utf-8")

          print("ML Kit R8 rules created and connected to release build.")
          print("Gradle file:", gradle)
          print("ProGuard rules:", rules)
          PY



      - name: Set App Display Name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          text = re.sub(
              r'android:label="[^"]*"',
              'android:label="ROLLO PDF"',
              text,
              count=1
          )

          manifest.write_text(text, encoding="utf-8")
          print("App name changed successfully")
          PY
          
      - name: Configure JP2 dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("android")
          root_gradle = next((p for p in [root / "build.gradle", root / "build.gradle.kts"] if p.exists()), None)
          app_gradle = next((p for p in [root / "app/build.gradle", root / "app/build.gradle.kts"] if p.exists()), None)

          if not root_gradle or not app_gradle:
              raise Exception("Gradle files lama helin")

          root_text = root_gradle.read_text()
          app_text = app_gradle.read_text()

          if "jitpack.io" not in root_text:
              pattern = r"(allprojects\s*\{\s*repositories\s*\{)"
              match = re.search(pattern, root_text)
              if not match:
                  raise Exception("allprojects repositories lama helin")
              root_text = root_text[:match.end()] + '\n        maven { url "https://jitpack.io" }\n' + root_text[match.end():]
              if root_gradle.name.endswith(".kts"):
                  root_text = root_text.replace('maven { url "https://jitpack.io" }', 'maven(url = "https://jitpack.io")')
              root_gradle.write_text(root_text)

          if "JP2ForAndroid" not in app_text:
              if app_gradle.name.endswith(".kts"):
                  app_text += '\n\ndependencies {\n    runtimeOnly("com.github.Tgo1014:JP2ForAndroid:1.0.4")\n}\n'
              else:
                  app_text += '\n\ndependencies {\n    runtimeOnly "com.github.Tgo1014:JP2ForAndroid:1.0.4"\n}\n'
              app_gradle.write_text(app_text)

          print("JP2 dependency configured successfully")
          PY


      
      - name: Install dependencies
        run: flutter pub get
        
      - name: Generate App Icon
        run: dart run flutter_launcher_icons
        
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease -x lintVitalAnalyzeRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAKIB-PDF-APK
          path: build/app/outputs/flutter-apk/app-release.apk
